name: Refresh 0912 market snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
permissions:
  contents: write
concurrency:
  group: refresh-0912-market
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Refresh public listing candidates
        run: python scripts/refresh_0912_market.py
      - name: Commit changed market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 0912/market-data.json public/0912/market-data.json
          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Refresh 0912 market snapshot"
            git push
          fi
